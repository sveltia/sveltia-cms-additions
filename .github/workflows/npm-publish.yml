# https://docs.npmjs.com/trusted-publishers

name: Publish Package to npmjs

on:
  release:
    types:
      - published

permissions: {}

jobs:
  publish:
    name: Test and Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing
    steps:
      - name: Checkout the branch
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm and Node.js
        uses: pnpm/setup@v3.2.0
        with:
          version: latest
          runtime: node@26
          cache: true
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm test
      # The package ships the source as it is; Wrangler bundles it when a deployment builds
      - name: Publish the package
        run: pnpm publish --no-git-checks --access public --provenance
  # A separate job without `id-token`, which only needs to write to the release
  attach-bundle:
    name: Attach the Bundle to the Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout the branch
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm and Node.js
        uses: pnpm/setup@v3.2.0
        with:
          version: latest
          runtime: node@26
          cache: true
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # For people who deploy through the Cloudflare API or their own tooling. Pasting it in the
      # dashboard isn’t supported: it can’t create the Durable Object class
      - name: Build the Worker bundle
        run: pnpm exec wrangler deploy --dry-run --outdir dist
      - name: Attach the bundle
        run: |
          cd dist
          zip -r "../sveltia-cms-additions-${{ github.event.release.tag_name }}.zip" .
          cd ..
          gh release upload "${{ github.event.release.tag_name }}" \
            "sveltia-cms-additions-${{ github.event.release.tag_name }}.zip"
        env:
          GH_TOKEN: ${{ github.token }}
