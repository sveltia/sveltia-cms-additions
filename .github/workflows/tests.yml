name: Tests

on: push

permissions: {}

jobs:
  ci:
    name: ${{ matrix.task.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        task:
          - name: Check
            command: pnpm check
          # The tests run in workerd, with real Durable Objects, and the core’s on Node as well
          - name: Test
            command: pnpm test
    steps:
      - name: Checkout the branch
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm and Node.js
        uses: pnpm/setup@v3.2.0
        with:
          version: latest
          runtime: node@26
          cache: true
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: ${{ matrix.task.name }}
        run: ${{ matrix.task.command }}
